<!DOCTYPE html>
<html lang="es">
<head>
    <!-- QPL7917 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios Vantus v9</title>
    <style>
        body { background: #fcf1ed; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        .contenedor { width: 100%; max-width: 1200px; box-sizing: border-box; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .form-inline { margin: 20px 0; text-align: center; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        .input-medium { width: 200px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-descargar { background-color: #d9534f; color: white; border: none; padding: 7px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; display: none; }
        .btn-descargar:hover { background-color: #c9302c; }

        .tabla-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table { width: 100%; margin-bottom: 20px; border-collapse: collapse; background-color: transparent; }
        .table th, .table td { padding: 6px; line-height: 18px; text-align: center; vertical-align: middle; border-top: 1px solid #ddd; min-width: 150px; }
        .table-bordered { border: 1px solid #ddd; border-collapse: separate; border-left: 0; border-radius: 4px; }
        .table-bordered th, .table-bordered td { border-left: 1px solid #ddd; }
        .well { min-height: 20px; padding: 6px; margin-bottom: 0; background-color: #f5f5f5; border: 1px solid #e3e3e3; border-radius: 4px; text-align: center; font-weight: bold; font-size: 12px; white-space: nowrap; }

        .lib { background-color: #ED5739 !important; color: #fff; cursor: pointer; font-size: 12px; font-weight: bold; }
        .parcial { background-color: #d1ecf1 !important; color: #0c5460; cursor: pointer; font-weight: bold; font-size: 12px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .form-inline { display: flex; flex-direction: column; gap: 10px; align-items: center; }
            .input-medium { width: 90%; }
        }
    </style>
    <script>
        const BIN_ID = "6adf7b63ffd5d160538d5a5e";
        const API_KEY = "$2a$10$ZbPs1irvlHJDayPscuOTu.ul9WRstaKHVR/QztDkHfssQCFVlKROa";

        let reservasData = {};
        const dias = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
        const horas = [
            "09:00 - 09:30", "09:30 - 10:00", "10:00 - 10:30", "10:30 - 11:00",
            "11:00 - 11:30", "11:30 - 12:00", "12:00 - 12:30", "12:30 - 13:00",
            "13:00 - 13:30", "13:30 - 14:00", "15:00 - 15:30", "15:30 - 16:00",
            "16:00 - 16:30", "16:30 - 17:00", "17:00 - 17:30", "17:30 - 18:00",
            "18:00 - 18:30", "18:30 - 19:00", "19:00 - 19:30", "19:30 - 20:00",
            "20:00 - 20:30", "20:30 - 21:00"
        ];

        document.addEventListener("DOMContentLoaded", function() {
            construirTabla();
            cargarDatosNube();

            let nombreInput = document.getElementById('txt_nombre');
            nombreInput.addEventListener('input', verificarAdmin);
        });

        function verificarAdmin() {
            let nombre = document.getElementById('txt_nombre').value.trim().toLowerCase();
            let btnDescargar = document.getElementById('btn_descargar');
            if (nombre === 'admin') {
                btnDescargar.style.display = 'inline-block';
            } else {
                btnDescargar.style.display = 'none';
            }
        }

        function obtenerNombreItem(r) {
            if (!r) return "";
            if (typeof r === "string") return r;
            return (r.nombre || "").toString();
        }

        function cargarDatosNube() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                reservasData = (data.record && typeof data.record === 'object') ? data.record : {};
                actualizarTodaLaVista();
            })
            .catch(err => console.error("Error al cargar datos:", err));
        }

        function guardarDatosNube(datosPersonalizados = null) {
            let payload = datosPersonalizados !== null ? datosPersonalizados : reservasData;
            return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .catch(err => console.error("Error al guardar datos:", err));
        }

        function manejarCelda(filaHora, colDia) {
            let nombreInput = document.getElementById('txt_nombre');
            let nombre = nombreInput ? nombreInput.value.trim() : "";

            if (!nombre || nombre.toLowerCase() === 'admin') {
                alert('Introduce un nombre válido para reservar.');
                return;
            }

            let key = filaHora + "-" + colDia;
            if (!reservasData[key] || !Array.isArray(reservasData[key])) reservasData[key] = [];

            const target = nombre.toLowerCase();
            let index = reservasData[key].findIndex(r => obtenerNombreItem(r).toLowerCase() === target);

            if (index !== -1) {
                reservasData[key].splice(index, 1);
            } else {
                reservasData[key].push({ nombre });
            }

            actualizarTodaLaVista();
            guardarDatosNube();
        }

        function construirTabla() {
            let thead = document.getElementById('cabecera-horarios');
            let tbody = document.getElementById('tabla-horarios');
            if (!tbody || !thead) return;

            thead.innerHTML = "";
            let trHead = document.createElement('tr');
            let thHora = document.createElement('th');
            thHora.innerHTML = `<div class="well">Hora</div>`;
            trHead.appendChild(thHora);

            dias.forEach(d => {
                let th = document.createElement('th');
                th.innerHTML = `<div class="well">${d}</div>`;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            tbody.innerHTML = "";
            horas.forEach((h, hIndex) => {
                let tr = document.createElement('tr');
                let tdHora = document.createElement('td');
                tdHora.innerHTML = `<strong>${h}</strong>`;
                tr.appendChild(tdHora);

                for (let dIndex = 0; dIndex < dias.length; dIndex++) {
                    let td = document.createElement('td');
                    td.id = `celda-${hIndex}-${dIndex}`;
                    td.className = "lib";
                    td.onclick = () => manejarCelda(hIndex, dIndex);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });
        }

        function actualizarTodaLaVista() {
            for (let h = 0; h < horas.length; h++) {
                for (let d = 0; d < dias.length; d++) {
                    let key = h + "-" + d;
                    let celda = document.getElementById(`celda-${h}-${d}`);
                    if (!celda) continue;

                    let lista = (reservasData[key] && Array.isArray(reservasData[key])) ? reservasData[key] : [];
                    let nombresValidos = lista.map(r => obtenerNombreItem(r)).filter(n => n !== "");
                    let count = nombresValidos.length;
                    let nombresHtml = nombresValidos.map(n => `<small style="display:block; font-size:10px;">- ${n}</small>`).join('');

                    celda.className = "";
                    if (count === 0) {
                        celda.classList.add('lib');
                        celda.innerHTML = `NO`;
                    } else {
                        celda.classList.add('parcial');
                        celda.innerHTML = nombresHtml + `<small>(${count})</small>`;
                    }
                }
            }
        }

        // FUNCIÓN DE DESCARGA Y BORRADO
        // QPL7917
        async function descargarYBorrar() {
            if (!confirm('¿Estás seguro de descargar el archivo y restablecer la base de datos?')) return;

            let contenidoTxt = "";

            dias.forEach((dia, dIndex) => {
                contenidoTxt += "-" + dia + "\r\n";

                horas.forEach((hora, hIndex) => {
                    let key = hIndex + "-" + dIndex;
                    let lista = (reservasData[key] && Array.isArray(reservasData[key])) ? reservasData[key] : [];
                    let nombresValidos = lista.map(r => obtenerNombreItem(r)).filter(n => n !== "");

                    let horaLimpia = hora.replace(/ /g, "").replace("-", "_");
                    contenidoTxt += "*" + horaLimpia + "\r\n";

                    if (nombresValidos.length > 0) {
                        nombresValidos.forEach(n => {
                            contenidoTxt += n + "\r\n";
                        });
                    }
                });

                contenidoTxt += "\r\n";
            });

            try {
                // Enviar la estructura con 'record' envuelto que exige JSONBin.io
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({
                        record: {
                            "dia": "Lunes"
                        }
                    })
                });

                if (!response.ok) {
                    const errorTexto = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorTexto}`);
                }

                // Vaciar los datos locales y actualizar la interfaz
                reservasData = {};
                actualizarTodaLaVista();

                // Descargar el archivo TXT
                let blob = new Blob([contenidoTxt], {
                    type: "text/plain;charset=utf-8"
                });

                let link = document.createElement("a");
                let url = URL.createObjectURL(blob);

                link.href = url;
                link.download = "reservas_vantus.txt";
                link.click();

                URL.revokeObjectURL(url);

                alert('Base de datos descargada y restablecida con éxito.');

            } catch (err) {
                console.error("Error al actualizar la base de datos:", err);
                alert('ERROR al actualizar la base de datos:\n' + err.message);
            }
        }
    
    </script>
</head>
<body>
<div class="contenedor">
    <h2>Horarios Vantus</h2>
    <form class="form-inline" onsubmit="return false;">
        <input type="text" id="txt_nombre" class="input-medium" placeholder="Nombre" required>
        <button type="button" id="btn_descargar" class="btn-descargar" onclick="descargarYBorrar()">Descargar y Borrar BD</button>
    </form>

    <div class="tabla-wrapper">
        <table class="table table-bordered">
            <thead id="cabecera-horarios"></thead>
            <tbody id="tabla-horarios"></tbody>
        </table>
