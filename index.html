<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horarios Vantus v2</title>
    <style>
        body { background: #fcf1ed; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        .contenedor { max-width: 1024px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .form-inline { margin: 20px 0; text-align: center; }
        .input-medium { width: 150px; padding: 4px 6px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .checkbox { display: inline-block; margin-left: 10px; font-weight: normal; }
        .table { width: 100%; margin-bottom: 20px; border-collapse: collapse; background-color: transparent; }
        .table th, .table td { padding: 8px; line-height: 20px; text-align: center; vertical-align: middle; border-top: 1px solid #ddd; }
        .table-bordered { border: 1px solid #ddd; border-collapse: separate; border-left: 0; border-radius: 4px; }
        .table-bordered th, .table-bordered td { border-left: 1px solid #ddd; }
        .well { min-height: 20px; padding: 10px; margin-bottom: 0; background-color: #f5f5f5; border: 1px solid #e3e3e3; border-radius: 4px; text-align: center; font-weight: bold; }
        
        .btn { display: inline-block; padding: 6px 12px; margin: 0 auto; font-size: 14px; line-height: 20px; color: #fff; text-align: center; vertical-align: middle; cursor: pointer; background-color: #388E3C; border: 1px solid #2E7D32; border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 2px rgba(0,0,0,0.05); }
        .btn:hover { background-color: #2E7D32; }

        .lib { background-color: #d4edda !important; cursor: pointer; }
        .pend { background-color: #fff3cd !important; color: #856404; cursor: pointer; font-weight: bold; }
        .parcial { background-color: #d1ecf1 !important; color: #0c5460; cursor: pointer; font-weight: bold; }
        .ocup { background-color: #f8d7da !important; color: #721c24; cursor: pointer; font-weight: bold; }
    </style>
    <script>
        // CONFIGURACIÓN DE JSONBIN.IO (Reemplaza con tus datos reales)
        const BIN_ID = "6adf7b63ffd5d160538d5a5e"; 
        const API_KEY = "$2a$10$ZbPs1irvlHJDayPscuOTu.ul9WRstaKHVR/QztDkHfssQCFVlKROa; 

        let reservasData = {};
        const dias = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
        const horas = ["09:00 - 11:00", "11:00 - 13:00", "15:00 - 17:00", "17:00 - 19:00", "19:00 - 21:00"];

        document.addEventListener("DOMContentLoaded", function() {
            construirTabla();
            cargarDatosNube();
            // Refrescar cada 5 segundos para simular tiempo real entre usuarios
            setInterval(cargarDatosNube, 5000);
        });

        function cargarDatosNube() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            })
            .then(response => response.json())
            .then(data => {
                reservasData = data.record || {};
                actualizarTodaLaVista();
            })
            .catch(err => console.error("Error al cargar datos:", err));
        }

        function guardarDatosNube() {
            return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(reservasData)
            })
            .then(response => response.json())
            .catch(err => console.error("Error al guardar datos:", err));
        }

        function contarTurnosPersona(nombre) {
            let total = 0;
            for (let k in reservasData) {
                if (reservasData[k] && reservasData[k].some(r => r.nombre === nombre)) total++;
            }
            return total;
        }

        function personaEnDia(nombre, fila) {
            for (let c = 0; c < 5; c++) {
                let k = fila + "-" + c;
                if (reservasData[k] && reservasData[k].some(r => r.nombre === nombre)) return true;
            }
            return false;
        }

        function manejarCelda(fila, col) {
            let nombre = document.getElementById('txt_nombre').value.trim();
            let telefono = document.getElementById('txt_telefono').value.trim();
            let veterano = document.getElementById('chk_veterano').checked;
            let turnoCompleto = document.getElementById('chk_completo').checked;

            if (!nombre || !telefono) {
                alert('Rellena nombre y teléfono.');
                return;
            }

            // Descargar primero los datos más recientes antes de modificar para evitar conflictos
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            })
            .then(res => res.json())
            .then(data => {
                reservasData = data.record || {};
                let key = fila + "-" + col;
                if (!reservasData[key]) reservasData[key] = [];

                let index = reservasData[key].findIndex(r => r.nombre === nombre);

                if (index !== -1) {
                    reservasData[key].splice(index, 1);
                } else {
                    if (personaEnDia(nombre, fila)) {
                        alert('Ya tienes un turno reservado este mismo día.');
                        return;
                    }
                    if (contarTurnosPersona(nombre) >= 3) {
                        alert('Límite máximo de 3 turnos totales alcanzado.');
                        return;
                    }

                    if (reservasData[key].length === 2 && !veterano) {
                        alert('El último hueco del grupo solo puede ser ocupado por un veterano.');
                        return;
                    }

                    if (reservasData[key].length < 3) {
                        reservasData[key].push({ nombre, telefono, veterano, turnoCompleto });
                    } else {
                        let idxRemovible = reservasData[key].findIndex(r => !r.turnoCompleto);
                        if (turnoCompleto && idxRemovible !== -1) {
                            reservasData[key].splice(idxRemovible, 1);
                            reservasData[key].push({ nombre, telefono, veterano, turnoCompleto });
                        } else {
                            alert('Grupo lleno (3/3).');
                            return;
                        }
                    }
                }

                guardarDatosNube().then(() => {
                    actualizarTodaLaVista();
                    let lista = reservasData[key];
                    let hayVeterano = lista.some(r => r.veterano);
                    let cerrado = (lista.length === 3 && hayVeterano);
                    console.log(JSON.stringify({
                        dia: dias[fila],
                        horario: horas[col],
                        grupo_cerrado: cerrado,
                        integrantes: lista
                    }, null, 2));
                });
            });
        }

        function construirTabla() {
            let tbody = document.getElementById('tabla-horarios');
            tbody.innerHTML = "";
            dias.forEach((d, fIndex) => {
                let tr = document.createElement('tr');
                let tdDia = document.createElement('td');
                tdDia.className = 'well';
                tdDia.innerHTML = `<b>${d}</b>`;
                tr.appendChild(tdDia);

                for (let cIndex = 0; cIndex < 5; cIndex++) {
                    let td = document.createElement('td');
                    td.id = `celda-${fIndex}-${cIndex}`;
                    td.onclick = function() { manejarCelda(fIndex, cIndex); };
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });
        }

        function actualizarTodaLaVista() {
            for (let f = 0; f < 5; f++) {
                for (let c = 0; c < 5; c++) {
                    let key = f + "-" + c;
                    let celda = document.getElementById(`celda-${f}-${c}`);
                    if (!celda) continue;

                    let lista = reservasData[key] || [];
                    let count = lista.length;
                    let hayVeterano = lista.some(r => r.veterano);
                    let nombresHtml = lista.map(r => `<small style="display:block; font-size:10px;">- ${r.nombre} ${r.veterano ? '(Vet)' : ''} ${r.turnoCompleto ? '[Completo]' : ''}</small>`).join('');

                    if (count === 0) {
                        celda.className = 'lib';
                        celda.innerHTML = '<div style="display:flex; justify-content:center;"><button class="btn">Reservar</button></div>';
                    } else if (!hayVeterano) {
                        celda.className = 'pend';
                        celda.innerHTML = `Pendiente (${count}/3)<br><small style="font-size:9px">Falta Veterano</small><br>${nombresHtml}`;
                    } else if (count < 3) {
                        celda.className = 'parcial';
                        celda.innerHTML = `${count}/3<br>${nombresHtml}`;
                    } else {
                        celda.className = 'ocup';
                        celda.innerHTML = `Ocupado (3/3)<br>${nombresHtml}`;
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div class="contenedor">
        <h2>Horarios Vantus</h2>
        
        <form class="form-inline" onsubmit="return false;">
            <input type="text" id="txt_nombre" class="input-medium" placeholder="Nombre" required>
            <input type="tel" id="txt_telefono" class="input-medium" placeholder="Teléfono" required>
            <label class="checkbox"><input type="checkbox" id="chk_veterano"> Veterano</label>
            <label class="checkbox"><input type="checkbox" id="chk_completo"> Turno completo</label>
        </form>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th></th>
                    <th><div class="well">09:00 - 11:00</div></th>
                    <th><div class="well">11:00 - 13:00</div></th>
                    <th><div class="well">15:00 - 17:00</div></th>
                    <th><div class="well">17:00 - 19:00</div></th>
                    <th><div class="well">19:00 - 21:00</div></th>
                </tr>
            </thead>
            <tbody id="tabla-horarios"></tbody>
        </table>
    </div>
</body>
</html>
