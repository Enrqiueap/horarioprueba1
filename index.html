        document.addEventListener("DOMContentLoaded", function() {
            construirTabla();
            cargarDatosNube();

            document.getElementById('txt_nombre').addEventListener('input', actualizarTodaLaVista);
        });

        function cargarDatosNube() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                reservasData = (data.record && typeof data.record === 'object') ? data.record : {};
                actualizarTodaLaVista();
            })
            .catch(err => console.error("Error al cargar datos:", err));
        }

        function guardarDatosNube() {
            return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(reservasData)
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .catch(err => console.error("Error al guardar datos:", err));
        }

        function manejarCelda(fila, col) {
            let nombre = document.getElementById('txt_nombre').value.trim();
            let telefono = document.getElementById('txt_telefono').value.trim();

            if (!nombre || !telefono) {
                alert('Rellena nombre y teléfono.');
                return;
            }

            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP error al verificar! status: ${res.status}`);
                return res.json();
            })
            .then(data => {
                reservasData = (data.record && typeof data.record === 'object') ? data.record : {};
                let key = fila + "-" + col;
                if (!reservasData[key] || !Array.isArray(reservasData[key])) reservasData[key] = [];

                let index = reservasData[key].findIndex(r => r.nombre === nombre);

                if (index !== -1) {
                    reservasData[key].splice(index, 1);
                } else {
                    reservasData[key].push({ nombre, telefono });
                }

                guardarDatosNube().then(() => {
                    actualizarTodaLaVista();
                });
            })
            .catch(err => console.error("Error en manejarCelda:", err));
        }
